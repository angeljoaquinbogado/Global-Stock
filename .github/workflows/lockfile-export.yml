name: Export npm lockfile

on:
  pull_request:
    paths:
      - "apex-stock-os/package.json"
      - ".github/workflows/lockfile-export.yml"

permissions:
  contents: read

jobs:
  export-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apex-stock-os
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate lockfile without package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Export lockfile to job log
        run: |
          echo "__GLOBAL_STOCK_LOCKFILE_BEGIN_7f3a__"
          cat package-lock.json
          echo "__GLOBAL_STOCK_LOCKFILE_END_7f3a__"
