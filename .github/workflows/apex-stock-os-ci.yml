name: Global Stock Web CI

on:
  push:
    branches:
      - apex-stock-os-nextjs
      - main
  pull_request:
    paths:
      - "apex-stock-os/**"
      - ".github/workflows/apex-stock-os-ci.yml"

permissions:
  contents: read

concurrency:
  group: global-stock-web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: apex-stock-os
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apex-stock-os/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: UI contract audit
        run: npm run ui:audit

      - name: Production build
        run: npm run build
