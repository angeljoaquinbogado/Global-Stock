name: Global Stock Expo Mobile QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/global-stock-expo-mobile-qa.yml"
      - "apps/global-stocks-mobile/**"

permissions:
  contents: read

concurrency:
  group: global-stock-expo-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/global-stocks-mobile
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Expo project
        run: npm install --no-audit --no-fund
      - name: Check tracked secrets, app identity and launcher
        run: npm run check:repo
      - name: Argentina beta safety gates
        run: npm run check:beta
      - name: Check mobile dependencies are declared and installed
        run: npm run check:deps
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check installed Expo package compatibility
        run: npx expo install --check
      - name: Bundle JavaScript for Android
        run: npx expo export --platform android --output-dir dist-android
      - name: Bundle JavaScript for iOS
        run: npx expo export --platform ios --output-dir dist-ios
