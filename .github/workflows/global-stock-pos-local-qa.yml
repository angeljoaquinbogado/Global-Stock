name: Global Stock Local POS QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/global-stock-pos-local-qa.yml"
      - "apex-stock-os/tests/postgres/**"
      # Also recheck when the real checkout API or DB migration code changes.
      - "apex-stock-os/app/api/pos/**"
      - "apex-stock-os/supabase/migrations/**"

permissions:
  contents: read

concurrency:
  group: global-stock-local-pos-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-pos-database:
    name: Ephemeral PostgreSQL / POS + cash + inventory
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: global_stock_test
      PGUSER: postgres
      PGPASSWORD: test-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Start isolated PostgreSQL with a registry fallback
        shell: bash
        run: |
          set -euo pipefail
          # Pulling Docker Hub directly in the services block can fail before
          # ANY test runs. Try two sources, then the runner's local service.
          for image in public.ecr.aws/docker/library/postgres:17 postgres:17; do
            echo "Attempting PostgreSQL image: $image"
            if timeout 45s docker pull "$image"; then
              docker run -d --name gs-qa-postgres \
                -e POSTGRES_PASSWORD=test-only \
                -e POSTGRES_USER=postgres \
                -e POSTGRES_DB=global_stock_test \
                -p 127.0.0.1:5432:5432 \
                "$image"
              for attempt in $(seq 1 40); do
                if PGPASSWORD=test-only pg_isready -h localhost -p 5432 -U postgres -d global_stock_test >/dev/null 2>&1; then
                  echo "PostgreSQL container is ready"
                  psql -c "select version();"
                  exit 0
                fi
                sleep 1
              done
              echo "::error::Container started but never became ready"
              exit 1
            fi
          done
          # Local hosted-runner PostgreSQL is a version-flexible fallback only.
          echo "::warning::External registries unavailable; use runner PostgreSQL."
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER ROLE postgres PASSWORD 'test-only';"
          sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname='global_stock_test'" | grep -q 1 \
            || sudo -u postgres createdb global_stock_test
          for attempt in $(seq 1 20); do
            if pg_isready -h localhost -p 5432 -U postgres -d global_stock_test >/dev/null 2>&1; then
              psql -c "select version();"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Neither container nor hosted PostgreSQL became ready"
          exit 1

      - name: Load isolated schema
        run: psql -v ON_ERROR_STOP=1 -f apex-stock-os/tests/postgres/fixture-schema.sql

      - name: Install actual deployed POS helper functions and triggers
        run: psql -v ON_ERROR_STOP=1 -f apex-stock-os/tests/postgres/live-helpers.sql

      - name: Install actual deployed sale commit and authorized RPC functions
        run: |
          psql -v ON_ERROR_STOP=1 -f apex-stock-os/tests/postgres/live-sale-commit.sql
          psql -v ON_ERROR_STOP=1 -f apex-stock-os/tests/postgres/live-sale-rpcs.sql

      - name: Execute synthetic POS sale, cash, stock and return assertions
        run: psql -v ON_ERROR_STOP=1 -f apex-stock-os/tests/postgres/assert-pos.sql

      - name: Test simultaneous stock contention and exact-operation retries
        run: bash apex-stock-os/tests/postgres/concurrent-pos.sh

      - name: Isolation reminder
        if: always()
        run: echo "All test products, sales and accounts lived only in the disposable PostgreSQL 17 CI service."
