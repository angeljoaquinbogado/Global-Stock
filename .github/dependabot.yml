version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apex-stock-os"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Major version bumps of ESLint, Tailwind, TypeScript, React UI libs, etc.
      # require coordinated migrations; automatically generated major PRs have
      # broken CI (e.g. ESLint 10 and Tailwind 4 vs our Next/Tailwind 3 config).
      # Allow minor/patch/security updates and review majors manually.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "security"
